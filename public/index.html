<!DOCTYPE html>
<html>
<head>
  <title>Co-op Dungeon Crawler</title>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    h1 {
      color: #ff0;
    }
    .status {
      font-size: 20px;
      margin: 20px;
      padding: 10px;
      border-radius: 5px;
    }
    .connected {
      background: #0f0;
      color: #000;
    }
    .disconnected {
      background: #f00;
      color: #fff;
    }
    button {
      padding: 12px 24px;
      margin: 10px;
      font-size: 16px;
      cursor: pointer;
      background: #444;
      color: #fff;
      border: none;
      border-radius: 5px;
    }
    button:hover {
      background: #666;
    }
    #room-id {
      padding: 8px;
      font-size: 16px;
      width: 200px;
      background: #333;
      color: #fff;
      border: 1px solid #555;
      border-radius: 5px;
    }
    #game-container {
      display: none;
      margin-top: 20px;
    }
    #game {
      width: 800px;
      height: 600px;
      margin: 0 auto;
      background: #222;
    }
    .player-list {
      margin-top: 20px;
      text-align: left;
      display: inline-block;
    }
    .player-list div {
      padding: 5px;
      margin: 5px;
      background: #333;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <h1>Co-op Dungeon Crawler</h1>
  
  <div id="status" class="status disconnected">
    Connecting to server...
  </div>
  
  <div id="lobby">
    <p>Select your class:</p>
    <button onclick="selectClass('warrior')">Warrior</button>
    <button onclick="selectClass('mage')">Mage</button>
    <button onclick="selectClass('rogue')">Rogue</button>
    
    <div style="margin-top: 20px;">
      <input type="text" id="room-id" placeholder="Room ID (leave blank to create)">
      <br>
      <button onclick="createRoom()">Create Room</button>
      <button onclick="joinRoom()">Join Room</button>
    </div>
    
    <div id="player-list" class="player-list"></div>
  </div>
  
  <div id="game-container">
    <div id="game"></div>
  </div>
  
  <script>
    // Socket.io connection (auto-connects to the same domain)
    const socket = io();
    let currentRoomId = null;
    let playerClass = 'warrior';
    
    // Update connection status on the page
    socket.on('connect', () => {
      document.getElementById('status').textContent = '✅ Connected to server!';
      document.getElementById('status').className = 'status connected';
      console.log('Connected to Socket.io server!');
    });
    
    socket.on('connect_error', (e) => {
      document.getElementById('status').textContent = '❌ Connection failed: ' + e.message;
      document.getElementById('status').className = 'status disconnected';
      console.error('Connection error:', e);
    });
    
    socket.on('disconnect', () => {
      document.getElementById('status').textContent = '⚠️ Disconnected from server';
      document.getElementById('status').className = 'status disconnected';
    });
    
    // Room events
    socket.on('roomCreated', (data) => {
      currentRoomId = data.roomId;
      document.getElementById('room-id').value = data.roomId;
      document.getElementById('status').textContent = 'Room created! ID: ' + data.roomId;
      document.getElementById('status').className = 'status connected';
    });
    
    socket.on('roomJoined', (data) => {
      currentRoomId = data.roomId;
      document.getElementById('status').textContent = 'Joined room: ' + data.roomId;
      document.getElementById('status').className = 'status connected';
    });
    
    socket.on('playerJoined', (data) => {
      const playerList = document.getElementById('player-list');
      const playerDiv = document.createElement('div');
      playerDiv.textContent = 'Player joined: ' + data.playerId.substring(0, 8) + ' (' + data.playerClass + ')';
      playerList.appendChild(playerDiv);
    });
    
    socket.on('playerLeft', (data) => {
      const playerList = document.getElementById('player-list');
      const playerDiv = document.createElement('div');
      playerDiv.textContent = 'Player left: ' + data.playerId.substring(0, 8);
      playerList.appendChild(playerDiv);
    });
    
    socket.on('error', (data) => {
      alert('Error: ' + data.message);
    });
    
    // Class selection
    function selectClass(className) {
      playerClass = className;
      document.getElementById('status').textContent = 'Selected: ' + className;
      document.getElementById('status').className = 'status connected';
    }
    
    // Create a new room
    function createRoom() {
      socket.emit('createRoom');
    }
    
    // Join an existing room
    function joinRoom() {
      const roomId = document.getElementById('room-id').value;
      if (!roomId) {
        alert('Please enter a Room ID or create a new room.');
        return;
      }
      socket.emit('joinRoom', { roomId: roomId, playerClass: playerClass });
    }
  </script>
</body>
</html>
