<!DOCTYPE html>
<html>
<head>
  <title>Co-op Dungeon Crawler</title>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
    }
    #lobby {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
    }
    button {
      padding: 10px 20px;
      margin: 5px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="lobby">
    <h1>Co-op Dungeon Crawler</h1>
    <p>Server is working! Open console to see Socket.io connection.</p>
    <button onclick="createRoom()">Create Room</button>
    <button onclick="joinRoom()">Join Room</button>
  </div>
  
  <script>
    const socket = io('http://localhost:3002');
    
    socket.on('connect', () => {
      console.log('✅ Connected to Socket.io server!');
      document.body.innerHTML += '<p style="color: green;">Socket.io connected! Open console for details.</p>';
    });
    
    socket.on('connect_error', (e) => {
      console.error('❌ Socket.io connection error:', e);
      document.body.innerHTML += '<p style="color: red;">Socket.io error: ' + e.message + '</p>';
    });
    
    function createRoom() {
      socket.emit('createRoom');
      console.log('Creating room...');
    }
    
    function joinRoom() {
      const roomId = prompt('Enter Room ID:');
      if (roomId) socket.emit('joinRoom', { roomId, playerClass: 'warrior' });
    }
  </script>
</body>
</html>
